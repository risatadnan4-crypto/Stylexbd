<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>STYLE X | Premium Luxury Clothing & Authentic Signature Collective</title>
    <meta name="title" content="STYLE X | Premium Luxury Clothing & Authentic Signature Collective" />
    <meta name="description" content="Welcome to STYLE X, the ultimate hub of luxury fashion and authentic premium lifestyle products. Experience the masterpiece of modern tailored apparel, exclusive lottery rewards, and 24/7 personal style assistance." />
    <meta name="keywords" content="style x, stylex, style x bd, style x clothing, style x bangladesh, style x premium, luxury fashion, premium clothing, style x online shop, authentic apparel, premium streetwear, style x store, fashion collective" />
    <meta name="author" content="Style X Collective" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://stylex.premium.shop" />

    <!-- Open Graph / Facebook / WhatsApp (Social Media Rich Previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stylex.premium.shop" />
    <meta property="og:title" content="STYLE X | Premium Luxury Clothing & Authentic Signature Collective" />
    <meta property="og:description" content="Discover royal streetwear, premium luxury items, and customized clothing. Take part in the Royal Spin Lottery and experience 24/7 smart fashion assistance." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1200&h=630&q=80" />
    <meta property="og:site_name" content="Style X" />

    <!-- Twitter Card (Twitter previews) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://stylex.premium.shop" />
    <meta property="twitter:title" content="STYLE X | Premium Luxury Clothing & Authentic Signature Collective" />
    <meta property="twitter:description" content="Discover royal streetwear, premium luxury items, and customized clothing. Take part in the Royal Spin Lottery." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1200&h=630&q=80" />

    <!-- Structured Data JSON-LD (Rich snippets for Google Search engine ranking) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Style X",
        "alternateName": ["StyleX", "STYLE X Premium", "Style X Bd"],
        "url": "https://stylex.premium.shop",
        "logo": "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=512&h=512&q=80",
        "description": "Style X is the ultimate e-commerce destination for premium clothing, royal streetwear, and signature lifestyle apparel. Experience high fashion and authentic quality with worldwide delivery.",
        "sameAs": [
          "https://facebook.com/stylex.premium",
          "https://instagram.com/stylex.premium"
        ],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://stylex.premium.shop/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- BreadcrumbList JSON-LD for navigational context & search snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://stylex.premium.shop"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Premium Catalog",
            "item": "https://stylex.premium.shop/#catalog"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": "Gentlemen Collective",
            "item": "https://stylex.premium.shop/#catalog?category=Gentlemen"
          },
          {
            "@type": "ListItem",
            "position": 4,
            "name": "Haute Couture",
            "item": "https://stylex.premium.shop/#catalog?category=Haute-Couture"
          }
        ]
      }
    </script>

    <!-- Google Fonts Preconnect and Links for high performance rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#050505]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
